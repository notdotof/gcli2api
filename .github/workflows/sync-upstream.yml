name: Sync Upstream

on:
  schedule:
    # 每天 04:00 和 16:00 UTC 自动执行检查同步
    - cron: '0 4,16 * * *'
  workflow_dispatch: # 支持在 GitHub 页面随时手动点击执行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/su-kaka/gcli2api.git || true
          git fetch upstream master

          # 检查上游是否有新提交
          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/master)
          echo "Behind upstream by: $BEHIND_COUNT commit(s)"

          if [ "$BEHIND_COUNT" -eq 0 ]; then
            echo "Already fully up to date with upstream master."
            exit 0
          fi

          echo "Merging upstream master..."
          git merge upstream/master -m "chore: sync upstream master" || {
            echo "::error::Merge conflict detected! Manual resolution required."
            exit 1
          }

          git push origin master
